<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Metals Daybook Dashboard</title>
<style>
:root{--gold:#C9A227;--silver:#8E959E;--copper:#B87333;--cash:#4A7FC1;--up:#1E8E4E;--down:#C0392B;--flat:#9AA0A6;--warn:#B7791F;
--bg:#F6F4EF;--card:#FFFFFF;--ink:#1C1F23;--muted:#666C73;--line:#E4E1D8;--soft:#EFECE4;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--gold:#D9B44A;--silver:#B8BEC6;--copper:#D08A4C;--cash:#6E9FDB;--up:#3CC47A;--down:#E8645A;--flat:#6B7178;--warn:#E0B04A;
--bg:#121417;--card:#1C1F24;--ink:#E8E6E1;--muted:#9AA0A6;--line:#2B3037;--soft:#262A30;color-scheme:dark}}
:root[data-theme=dark]{--gold:#D9B44A;--silver:#B8BEC6;--copper:#D08A4C;--cash:#6E9FDB;--up:#3CC47A;--down:#E8645A;--flat:#6B7178;--warn:#E0B04A;
--bg:#121417;--card:#1C1F24;--ink:#E8E6E1;--muted:#9AA0A6;--line:#2B3037;--soft:#262A30;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
main{max-width:1120px;margin:0 auto;padding:8px 16px 48px;display:grid;gap:16px}
.bar{max-width:1120px;margin:0 auto;padding:12px 16px 4px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:.02em}
.brand small{color:var(--muted);font-weight:500;margin-left:6px}
.ibtn{border:1px solid var(--line);background:var(--card);border-radius:999px;width:32px;height:30px;font-size:15px}
button:focus-visible,summary:focus-visible{outline:3px solid var(--cash);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
h2{margin:0 0 12px;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.big{font-size:clamp(38px,7vw,60px);font-weight:750;letter-spacing:-.025em;line-height:1}
.stat{display:grid;gap:3px}
.lbl{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.chip{display:inline-flex;gap:5px;align-items:baseline;padding:4px 11px;border-radius:999px;font-weight:700;font-size:15px;white-space:nowrap;background:color-mix(in srgb,currentColor 13%,transparent)}
.chip small{font-weight:500;font-size:12px}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--muted)}
.pf{font-weight:700;white-space:nowrap}.pf small{font-weight:500;font-size:.85em}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 11px;font-size:13px;display:inline-flex;gap:7px;align-items:center;color:var(--muted);white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--flat);display:inline-block}
.pill.live .dot{background:var(--up);animation:pulse 1.6s infinite}
.pill.late .dot{background:var(--warn)}
@keyframes pulse{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--up) 25%,transparent)}}
@media(prefers-reduced-motion:reduce){.pill.live .dot{animation:none}*{transition:none!important}}
.sw{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;background:var(--c);vertical-align:-1px}
.abar{display:flex;height:20px;border-radius:10px;overflow:hidden;background:var(--soft);gap:2px}
.abar i{display:block;height:100%;min-width:3px}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;margin-top:8px;color:var(--muted)}
.leg b{color:var(--ink);font-weight:650}
.htw{container-type:inline-size}
.ht{width:100%;border-collapse:collapse}
.ht th{font-size:12px;color:var(--muted);text-align:right;font-weight:650;padding:6px 8px;border-bottom:1px solid var(--line)}
.ht td{padding:11px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.ht th:first-child,.ht td:first-child{text-align:left}
.ht .fund{font-weight:700}
.ht tr.nh td{color:var(--muted);text-align:left;font-size:14px;padding:8px}
.ht tr.tot td{font-weight:700;border-bottom:0}
.ht td.mut{color:var(--muted)}
@container (max-width:640px){
 .ht thead{display:none}
 .ht,.ht tbody{display:block}
 .ht tr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 8px;padding:11px 0;border-bottom:1px solid var(--line)}
 .ht td{display:block;border:0;padding:0;text-align:left;white-space:normal}
 .ht td::before{content:attr(data-l);display:block;font-size:11px;color:var(--muted);font-weight:650}
 .ht td:first-child{grid-column:1/-1;font-size:16px}
 .ht td:first-child::before{display:none}
 .ht td.na{display:none}
 .ht tr.nh{padding:8px 0}
 .ht tr.tot{border-bottom:0}
 .ht .pf{white-space:normal}.ht .pf small{display:block}
}
.trade{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;width:100%;text-align:left;background:transparent;border:0;padding:9px 0;border-bottom:1px solid var(--line)}
.trade:last-child{border-bottom:0}
.trade .when{color:var(--muted);font-size:13px;min-width:92px}
.badge{font-size:12px;font-weight:750;border-radius:6px;padding:2px 8px;color:#fff;letter-spacing:.04em}
.badge.BUY{background:var(--up)}.badge.SELL{background:var(--down)}
.trade .what{font-weight:650}
.trade .amt{margin-left:auto;font-weight:650}
.trade .fee,.trade .pr{color:var(--muted);font-size:12px}
.trade:hover{background:var(--soft)}
.twhy{color:var(--muted);font-size:12.5px;padding:0 0 8px;overflow-wrap:anywhere}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.dn{display:flex;gap:6px;align-items:center}
.dn .ibtn{width:34px;height:34px}
svg text{font-family:inherit;font-variant-numeric:tabular-nums}
.hero2{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 28px;padding:6px 2px}
.hero2 .pill{margin-left:auto}
.mnote{font-size:12.5px;color:var(--muted);margin-top:10px}
.map{display:grid;grid-template-columns:minmax(260px,420px) 1fr;gap:20px;align-items:center}
.dwrap{position:relative;max-width:380px;margin:0 auto;width:100%}
.donut{width:100%;height:auto;display:block}
.dseg{transition:opacity .15s,stroke-width .15s;cursor:pointer}
.map.hl .dseg{opacity:.28}.map.hl .dseg.on{opacity:1;stroke-width:34}
.viewpill{position:absolute;left:50%;top:-6px;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:999px;padding:3px 12px;font-size:12px;font-weight:650;display:none;white-space:nowrap}
.viewpill.show{display:block}
.fcards{display:grid;gap:10px}
.fcard{display:grid;grid-template-columns:1fr minmax(80px,130px);gap:4px 14px;align-items:center;border:1px solid var(--line);border-left:7px solid var(--c);border-radius:12px;padding:10px 14px;background:var(--card);transition:transform .15s,box-shadow .15s}
.fcard.on{box-shadow:0 0 0 2px var(--c);transform:translateX(3px)}
.map.hl .fcard:not(.on){opacity:.5}
.fcard h3{margin:0;font-size:14px;display:flex;gap:8px;align-items:baseline}
.fcard .val{font-size:24px;font-weight:750;line-height:1.1}
.fcard .sh{font-size:14px;font-weight:650}
.fcard .sub{font-size:13px;color:var(--muted)}
.fcard.nh{background:transparent;border-style:dashed;border-left-style:solid}
.fcard.nh .val{color:var(--muted);font-size:20px}
.fcard .sp{grid-row:1/6;grid-column:2}
.hm{display:flex;gap:4px;overflow-x:auto;padding:2px 2px 8px}
body{--fb:color-mix(in srgb,var(--flat) 30%,var(--card))}
.hm .wd{display:grid;grid-template-rows:18px repeat(5,28px);gap:4px;font-size:11px;color:var(--muted);text-align:right;padding-right:4px}
.hm .wd span{line-height:28px}
.wk{display:grid;grid-template-rows:18px repeat(5,28px);gap:4px}
.wk .ml{font-size:11px;color:var(--muted);line-height:18px;white-space:nowrap;overflow:visible}
.cell{width:28px;height:28px;border-radius:7px;border:0;padding:0;position:relative;font-size:9px;color:var(--ink);background:var(--fb)}
.cell span.dn2{opacity:.55;position:absolute;left:4px;top:3px}
.cell.e{background:transparent;border:1px dashed var(--line);cursor:default}
.cell.sel{outline:3px solid var(--ink);outline-offset:1px}
.cell .td{position:absolute;right:3px;bottom:3px;width:8px;height:8px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 1.5px var(--card)}
.hmleg{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap;margin-top:6px}
.grad{display:inline-block;width:120px;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--down),var(--fb),var(--up))}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:12px}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(470px,100vw);background:var(--card);border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(0,0,0,.14);transform:translateX(105%);visibility:hidden;transition:transform .25s,visibility .25s;overflow-y:auto;padding:16px 18px 28px;z-index:30}
#drawer.open{transform:none;visibility:visible}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:25;display:none}
.dh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dh h3{margin:0;font-size:20px}
.dtotal{font-size:34px;font-weight:750;margin:10px 0 4px;letter-spacing:-.02em}
.dchips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.dhead{font-size:13.5px;color:var(--muted);margin:0 0 12px;overflow-wrap:anywhere}
.pxrow{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:13px;margin-top:6px}
#drawer h4{margin:18px 0 8px;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
details.det{margin-top:18px;border:1px solid var(--line);border-radius:12px;padding:0 12px}
details.det>summary{cursor:pointer;padding:10px 0;font-weight:650;font-size:14px}
details.det .body{padding-bottom:10px;font-size:13px}
.dcount{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.dcount span{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px}
.dec{display:grid;grid-template-columns:44px 1fr;gap:2px 8px;padding:7px 0;border-top:1px solid var(--line)}
.dec .tm{color:var(--muted);font-size:12px}
.dec .tag{font-size:11px;font-weight:700;color:#fff;border-radius:5px;padding:0 6px;margin-right:6px;background:var(--flat)}
.dec .tag.BUY{background:var(--up)}.dec .tag.SELL{background:var(--down)}.dec .tag.BLOCK{background:var(--warn)}
.dec .why{grid-column:2;color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
details.sub{margin-top:8px}
details.sub>summary{cursor:pointer;color:var(--muted);font-size:13px}
.mins{width:100%;border-collapse:collapse;font-size:12px}
.mins td,.mins th{border-top:1px solid var(--line);padding:4px 4px;text-align:left;vertical-align:top;overflow-wrap:anywhere}
.mins th{color:var(--muted);font-weight:600}
.minwrap{max-height:320px;overflow:auto}
@media(min-width:1100px){body.dopen main,body.dopen .bar{margin-right:480px;margin-left:0;max-width:none}}
@media(max-width:700px){
 main{padding:6px 12px 40px}.bar{padding:10px 12px 2px}
 .map{grid-template-columns:1fr;gap:12px}
 .dwrap{max-width:240px}
 .fcards{grid-template-columns:1fr 1fr}
 .fcard{grid-template-columns:1fr;padding:10px}.fcard .sp{grid-row:auto;grid-column:auto}
 .fcard .val{font-size:20px}
 #drawer{top:auto;left:0;right:0;width:auto;height:85vh;border-radius:18px 18px 0 0;border-left:0;transform:translateY(105%)}
 body.dopen #scrim{display:block}
 .hero2 .pill{margin-left:0}
}
</style></head><body>
<div class="bar"><div class="brand">Metals Daybook <small>paper money</small></div><button class="ibtn" id="theme" title="Theme: auto" aria-label="Toggle theme">◐</button></div>
<main id="app">
<div id="top"></div>
<section class="card map" id="map-card"><div class="dwrap-slot" style="display:contents" id="map"></div></section>
<section class="card" id="hold"></section>
<section class="card" id="cal"></section>
<section class="card" id="trades"></section>
</main>
<div id="scrim"></div>
<aside id="drawer" aria-hidden="true" aria-label="Day detail"></aside>
<script>
/* ===== Metals Daybook: Money map. Paper money only. No external libraries. ===== */
const EMBEDDED = __DATA__;
const REPO = "Rammanobi/simulate_gold", RAW = "https://raw.githubusercontent.com/" + REPO + "/";
const LIVE_URL = RAW + "live/now.json", HISTORY_URL = RAW + "main/logs/alldays.json", DETAIL_URL = RAW + "main/logs/dashboard-";
const NOPOLL = /static/.test(location.hash);
const FUNDS = [{sym:'GOLDBEES',name:'Gold',v:'--gold'},{sym:'SILVERBEES',name:'Silver',v:'--silver'},{sym:'HINDCOPPER',name:'Copper',v:'--copper'}];
const SEGS = FUNDS.concat([{sym:'CASH',name:'Cash',v:'--cash'}]);
const FUND = Object.fromEntries(SEGS.map(s => [s.sym, s]));
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const sum = a => a.reduce((x, y) => x + y, 0);
const num = x => (typeof x === 'number' && isFinite(x)) ? x : null;

function fmtINR(n, dec) { dec = dec || 0; const a = Math.abs(n);
  const s = a.toLocaleString('en-IN', {minimumFractionDigits: dec, maximumFractionDigits: dec});
  return (n < 0 && Number(a.toFixed(dec)) !== 0 ? '-' : '') + '\u20B9' + s; }
function fmtShort(n) { const a = Math.abs(n), s = n < 0 ? '-' : '';
  if (a >= 1e5) return s + '\u20B9' + (a / 1e5).toFixed(2) + ' L';
  if (a >= 1e3) return s + '\u20B9' + (a / 1e3).toFixed(1) + 'k';
  return s + '\u20B9' + Math.round(a); }
function tickLabel(n) { const a = Math.abs(n); return a >= 1e5 ? '\u20B9' + parseFloat((a / 1e5).toFixed(2)) + 'L' : a >= 1e3 ? '\u20B9' + parseFloat((a / 1e3).toFixed(1)) + 'k' : '\u20B9' + Math.round(a); }
function pctStr(p, d) { d = d == null ? 1 : d; return (p > 0 ? '+' : '') + p.toFixed(d) + '%'; }
function dir(v) { return Math.abs(v) < 0.5 ? 'flat' : (v > 0 ? 'up' : 'down'); }
function signChip(v, pct, o) { o = o || {}; const d = dir(v);
  const amt = fmtINR(Math.abs(v));
  const txt = d === 'flat' ? '\u00B1 \u20B90' : (d === 'up' ? '\u25B2 +' : '\u25BC -') + amt;
  const p = (pct != null && d !== 'flat') ? ' <small>(' + pctStr(pct) + ')</small>' : '';
  return '<span class="' + (o.plain ? 'pf ' : 'chip ') + d + '">' + txt + p + '</span>'; }
function parseISO(s) { const a = s.split('-').map(Number); return new Date(a[0], a[1] - 1, a[2]); }
function fmtDate(s, wd) { const d = parseISO(s); return (wd ? WD[d.getDay()] + ' ' : '') + d.getDate() + ' ' + MON[d.getMonth()]; }
function fmtTime(iso) { const m = /T(\d\d:\d\d)/.exec(iso || ''); return m ? m[1] : ''; }
function swatch(sym) { return '<i class="sw" style="--c:var(' + FUND[sym].v + ')"></i>'; }
const istNow = () => new Date(Date.now() + (330 + new Date().getTimezoneOffset()) * 60000);
function marketHours() { const n = istNow(), m = n.getHours() * 60 + n.getMinutes(), w = n.getDay(); return w > 0 && w < 6 && m >= 9 * 60 + 15 && m <= 15 * 60 + 35; }

/* ---------- data: alldays.json -> view model ---------- */
function normTrade(t, date) { return {id: t.id, pair: t.pair, status: t.status, date: t.date || date, time: t.time, symbol: t.symbol, side: t.side,
  units: t.units != null ? t.units : t.qty, price: t.price, amount: t.amount, costs: t.costs || 0, pnl: t.pnl != null ? t.pnl : t.profit, reason: t.reason || ''}; }
function normHold(h) { return {symbol: h.symbol, units: h.units != null ? h.units : h.qty, avg: h.avg != null ? h.avg : h.avg_price,
  invested: h.invested != null ? h.invested : h.cost, price: h.price, value: h.value,
  gain: h.gain != null ? h.gain : h.profit, gainPct: h.gainPct != null ? h.gainPct : h.profit_pct}; }
function normPrices(p) { const o = {}; for (const k in (p || {})) { const v = p[k]; o[k] = (v && typeof v === 'object') ? v.close : v; } return o; }
function normChg(p) { const o = {}; for (const k in (p || {})) { const v = p[k]; o[k] = (v && typeof v === 'object') ? v.chg_pct : null; } return o; }
function normAlloc(a) { a = a || {}; return {GOLDBEES: a.GOLDBEES || 0, SILVERBEES: a.SILVERBEES || 0, HINDCOPPER: a.HINDCOPPER || 0, CASH: (a.Cash || 0) + (a.CASH || 0) + (a.LIQUIDBEES || 0)}; }
function normalise(r) {
  const start = r.start_capital || 100000;
  const days = r.days.map(d => { const alloc = normAlloc(d.alloc), close = d.close_value;
    const invested = d.invested_value != null ? d.invested_value : alloc.GOLDBEES + alloc.SILVERBEES + alloc.HINDCOPPER;
    return {date: d.date, close: close, open: d.open_value, dayProfit: d.day_profit, dayPct: d.day_profit_pct,
      overall: d.overall_profit != null ? d.overall_profit : close - start,
      overallPct: d.overall_profit_pct != null ? d.overall_profit_pct : (close / start - 1) * 100,
      invested: invested, cash: d.cash_value != null ? d.cash_value : alloc.CASH, alloc: alloc, headline: d.headline || '', idle: d.idle_instrument || '',
      holdings: (d.holdings || []).map(normHold), trades: (d.trades || []).map(t => normTrade(t, d.date)),
      prices: normPrices(d.prices), chg: normChg(d.prices), intraday: d.intraday || []}; });
  const tradesAll = (r.trades_all || []).map(t => normTrade(t)).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  const buys = {}, sells = {};
  tradesAll.forEach(t => { if (!t.pair) return; if (t.side === 'BUY') buys[t.pair] = t; else (sells[t.pair] = sells[t.pair] || []).push(t); });
  tradesAll.forEach(t => { t.partner = t.side === 'BUY' ? (sells[t.pair] || []).map(x => 'sold ' + fmtDate(x.date)).join(', ') : (buys[t.pair] ? 'bought ' + fmtDate(buys[t.pair].date) : ''); });
  const byId = Object.fromEntries(tradesAll.map(t => [t.id, t])); days.forEach(d => d.trades.forEach(t => { t.partner = (byId[t.id] || {}).partner || ''; }));
  const last = days[days.length - 1], n = r.now || {};
  FUNDS.forEach(f => { const fp = days.find(d => d.prices[f.sym] != null); if (!fp) return; days.forEach(d => { if (d.prices[f.sym] == null) d.prices[f.sym] = fp.prices[f.sym]; }); });
  const now = {date: n.date || last.date, asOf: n.as_of || r.as_of, total: n.close_value != null ? n.close_value : last.close,
    holdings: (n.holdings || last.holdings).map(normHold), prices: Object.assign({}, last.prices, n.prices ? normPrices(n.prices) : {}),
    alloc: normAlloc(n.alloc || last.alloc), dayProfit: n.day_profit != null ? n.day_profit : last.dayProfit, idle: n.idle_instrument || last.idle, live: false};
  now.overall = now.total - start; now.overallPct = (now.total / start - 1) * 100;
  now.dayPct = now.total - now.dayProfit ? now.dayProfit / (now.total - now.dayProfit) * 100 : 0;
  return {start: start, days: days, tradesAll: tradesAll, now: now, byDate: Object.fromEntries(days.map((d, i) => [d.date, i]))};
}

/* ---------- live overlay: now.json (contract v:1) on top of the last day ---------- */
let D = null, LIVE = null, liveFail = false, sel = null, liveTimer = null;
function validLive(d) { return d && d.v === 1 && typeof d.ts === 'string' && isFinite(Date.parse(d.ts)) && d.today && d.open && d.total && Array.isArray(d.positions) && num(d.total_value) != null; }
function view() { /* the "now" the top of the page shows: stored last day, or the live file when it is newer */
  const n = D.now; if (!LIVE || LIVE.session_date < D.days[D.days.length - 1].date) return n;
  const L = LIVE, LP = L.prices || {}, prices = Object.assign({}, n.prices), hold = [];
  FUNDS.forEach(f => { const p = LP[f.sym]; if (p && num(p.price) != null) prices[f.sym] = p.price; });
  (L.positions || []).forEach(p => { const px = num((LP[p.symbol] || {}).price) != null ? LP[p.symbol].price : p.price, value = p.qty * px;

  const rows = doc.checks && doc.checks.rows || [];
  if (rows.length) h += '<details class="sub" id="mins"><summary>Every-minute checks (' + rows.length + ')</summary><div class="minwrap" id="minbody"></div></details>';
  return h; }
function minsHtml(doc) { const ck = doc.checks, syms = ck.syms || [];
  let h = '<table class="mins"><thead><tr><th>Time</th><th>Value</th>' + syms.map(s => '<th>' + esc(s) + '</th>').join('') + '</tr></thead><tbody>', prev = [];
  ck.rows.forEach(r => { h += '<tr><td>' + esc(r[0]) + '</td><td>' + (num(r[1]) != null ? fmtINR(r[1]) : '') + '</td>' + r[2].map((ix, k) => '<td>' + (prev[k] === ix ? '<span style="color:var(--muted)">same</span>' : esc(ck.texts[ix] || '')) + '</td>').join('') + '</tr>'; prev = r[2]; });
  return h + '</tbody></table>'; }
async function loadDetails(date) { const body = $('#detbody'); if (!body) return; body.innerHTML = '<div class="empty">Loading\u2026</div>';
  try { let e = DET[date]; if (!e || (Date.now() - e.t > 300000 && date >= D.days[D.days.length - 1].date)) { e = DET[date] = {t: Date.now(), doc: await fetchJSON(DETAIL_URL + date + '.json')}; }
    if (sel !== date) return; body.innerHTML = detailsHtml(e.doc); }
  catch (err) { if (sel === date) body.innerHTML = '<div class="empty">Could not load the decisions of this day (offline, or not pushed yet). Open the page with a connection to see them.</div>'; } }

/* ---------- render ---------- */
function renderTop() { const n = view(); $('#top').innerHTML = topHtml(n); $('#map').innerHTML = mapHtml(n); $('#hold').innerHTML = holdHtml(n); paintStatus();
  const vp = $('#viewpill'); if (vp && sel) { vp.textContent = 'viewing ' + fmtDate(sel); vp.classList.add('show'); } }
function renderAll() { renderTop(); $('#cal').innerHTML = calHtml(); $('#trades').innerHTML = tradesHtml(); const hm = $('#hm'); hm.scrollLeft = hm.scrollWidth; if (sel && D.byDate[sel] != null) openDay(sel); else if (sel) closeDay(); }

/* ---------- polling ---------- */
function setData(raw) { D = normalise(raw); }
async function pollLive() { if (NOPOLL) return; clearTimeout(liveTimer);
  try { const d = await fetchJSON(LIVE_URL); if (!validLive(d)) throw new Error('bad payload'); liveFail = false; if (!LIVE || Date.parse(d.ts) >= Date.parse(LIVE.ts)) { LIVE = d; renderTop(); } }
  catch (e) { liveFail = true; paintStatus(); }
  clearTimeout(liveTimer); liveTimer = setTimeout(pollLive, marketHours() ? 30000 : 900000); }
async function pollHistory() { if (NOPOLL) return;
  try { const r = await fetchJSON(HISTORY_URL); if (r && r.v === 1 && Array.isArray(r.days) && r.days.length) { if (r.as_of !== EMB_KEY.as_of || r.days.length !== EMB_KEY.n) { EMB_KEY = {as_of: r.as_of, n: r.days.length}; setData(r); renderAll(); } } }
  catch (e) { /* keep what we have */ }
  setTimeout(pollHistory, marketHours() ? 300000 : 900000); }
let EMB_KEY = {as_of: EMBEDDED.as_of, n: EMBEDDED.days.length};

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const c = e.target.closest('.cell[data-date]'); if (c) { openDay(c.dataset.date); return; }
  const t = e.target.closest('.trade[data-date]'); if (t && !t.closest('#drawer')) { openDay(t.dataset.date, true); return; }
  if (e.target.closest('#dclose') || e.target.id === 'scrim') { closeDay(); return; }
  const s = e.target.closest('[data-step]'); if (s) { step(+s.dataset.step); return; }
  if (e.target.closest('#theme')) { const cur = document.documentElement.getAttribute('data-theme'), nx = {null: 'light', light: 'dark', dark: null}[cur]; if (nx) document.documentElement.setAttribute('data-theme', nx); else document.documentElement.removeAttribute('data-theme'); e.target.closest('#theme').title = 'Theme: ' + (nx || 'auto'); } });
document.addEventListener('toggle', e => { const t = e.target;
  if (t.id === 'det' && t.open) loadDetails(t.dataset.date);
  if (t.id === 'mins' && t.open) { const e2 = DET[sel]; if (e2 && !$('#minbody').firstChild) $('#minbody').innerHTML = minsHtml(e2.doc); } }, true);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDay(); else if (sel && e.key === 'ArrowLeft') { step(-1); e.preventDefault(); } else if (sel && e.key === 'ArrowRight') { step(1); e.preventDefault(); } });
function hl(sym, on) { const m = $('#map-card'); if (!m) return; m.classList.toggle('hl', on); $$('[data-seg]', m).forEach(x => x.classList.toggle('on', on && x.dataset.seg === sym)); }
document.addEventListener('pointerover', e => { const s = e.target.closest('#map-card [data-seg]'); if (s) hl(s.dataset.seg, true); });
document.addEventListener('pointerout', e => { const s = e.target.closest('#map-card [data-seg]'); if (s) hl(null, false); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && !NOPOLL) pollLive(); });

setData(EMBEDDED);
renderAll();
setInterval(paintStatus, 1000);
if (location.hash.indexOf('day=') >= 0) { const m = /day=(\d{4}-\d{2}-\d{2})/.exec(location.hash); if (m) openDay(m[1], true); }
if (!NOPOLL) { pollLive(); setTimeout(pollHistory, 5000); }
</script></body></html>

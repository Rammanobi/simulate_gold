# simulate_gold rulebook v1 - all amounts in INR, percentages as decimals
# Sections up to `governance` are the rulebook section 10 block, verbatim.
# The `engine:` section at the bottom holds engine-only extras (tickers, tolerances).
capital:
  start: 100000
  # Owner decision 2026-10-22: idle money is plain cash in the account (earns nothing), not LIQUIDBEES.
  # `cash` = buys and sells go straight through the cash balance, no yield accrues, any LIQUIDBEES balance is
  # moved to cash once (no cost). `liquidbees` = the old behaviour (idle money parked in LIQUIDBEES, earns the yield).
  # One-line rollback: set idle: liquidbees.
  idle: cash                        # cash | liquidbees
  park_symbol: LIQUIDBEES
  park_ticker: LIQUIDBEES.NS        # cash-parking instrument; modelled as a rupee balance
  liquid_credit: daily_pro_rata_calendar   # yield/365 per calendar day, credited daily
  liquid_yield_annual: 0.063
  liquid_carry_haircut: 0.8          # green_budget uses 80% of expected carry
  min_cash_pct: 0.30

valuation:
  mark: ltp_minus_exit_cost          # value is net of round-trip/2 exit cost
  month_end_mark: close_last_nse_trading_day
  paper_slippage: {GOLDBEES: 0.0005, SILVERBEES: 0.0005, HINDCOPPER: 0.0010}

green_guard:
  initial_floor: 99500
  lock_trigger_profit: 500
  locked_floor: 100000
  ratchet_share: 0.50
  ratchet_offset: 500                # floor = 100000 + 0.5*(best_profit - 500); set 0 for literal
  floor_never_decreases: true
  tripwire_buffer: 100               # flatten all at value <= floor + 100
  tripwire_cooldown: next_trading_day
  caution_buffer: 300                # no new buys at value <= floor + 300
  monthly_reset: false               # floor carries over and keeps ratcheting

sizing:
  risk_formula: qty * price * (gap_pct * gap_multiplier + cost_pct)
  reserve: 100                       # usable = min(cushion - 100, green_budget) * week_factor
  green_budget_target: 100000
  green_budget_buffer: 100
  week_factor:   {week1: 0.50, week2: 0.75, rest: 1.00}
  week_days:     {week1: [1, 5], week2: [6, 10]}
  max_gross_pct: {week1: 0.30, week2: 0.50, rest: 0.70}
  gap_multiplier: {weekend: 1.25, nse_holiday_global_open: 1.5}
  round_qty: floor

instruments:
  GOLDBEES:   {cap_pct: 0.60, stop: 0.012, gap: 0.03, cost: 0.0010, target_half: 0.015, trail: 0.010, time_stop_days: 5}
  SILVERBEES: {cap_pct: 0.30, stop: 0.020, gap: 0.05, cost: 0.0010, target_half: 0.025, trail: 0.016, time_stop_days: 4}
  HINDCOPPER: {cap_pct: 0.15, stop: 0.030, gap: 0.07, cost: 0.0025, target_half: 0.040, trail: 0.025, time_stop_days: 3}

positions:
  max_open: 3
  one_per_instrument: true
  max_adds: 1
  add_requires_progress: 0.5         # fraction of target_half already reached
  after_half_stop: entry_plus_costs
  score_exit_below: 0.35
  score_exit_time: "15:15"
  time_stop_exit_time: "15:15"

entry:
  score_confirm_minutes: 3
  max_price_age_min: 3
  thresholds:
    favour:  {GOLDBEES: 0.65, SILVERBEES: 0.70, HINDCOPPER: 0.75}
    neutral: {GOLDBEES: 0.70, SILVERBEES: 0.75, HINDCOPPER: 0.80}
    block:   no_buys
  stale_guidance_minutes: 75
  stale_guidance_penalty: 0.05       # treated as neutral + 0.05
  score_weights:
    close_gt_ema20: 0.15
    ema20_gt_ema50: 0.15
    ret10d_pos: 0.10
    rsi14_50_70: 0.15
    price_gt_vwap: 0.10
    price_gt_or15_high: 0.15
    range_lt_1p5_atr14: 0.10
    open_gap_lt_1_dailyvol: 0.10

daily_limits:
  max_buys_per_day: 3
  max_buys_per_instrument_day: 1
  max_buys_per_instrument_week: 3
  min_minutes_between_buys: 30
  no_rebuy_after_stop_same_day: true
  no_buys_before: "09:30"
  no_buys_after: "15:00"
  max_losing_trades_then_stop: 2
  overnight_check_time: "15:20"

fast_lane:
  max_runs_per_day: 4
  min_minutes_between_runs: 20
  shock_window_min: 10
  shock_pct:      {GOLDBEES: 0.006, SILVERBEES: 0.010, HINDCOPPER: 0.018}
  from_close_pct: {GOLDBEES: 0.015, SILVERBEES: 0.027, HINDCOPPER: 0.040}
  from_close_once_per_day: true
  portfolio_drop_share_of_cushion: 0.40
  portfolio_drop_window_min: 15
  auto_block_on_shock_min: 30
  auto_block_when_limit_hit_min: 60
  news_file: news_triggers.yaml
  add_categories: [india_duty_budget, company_actions, market_halt]
  allowed_actions: [set_bias_neutral, set_bias_block, exit_partial, exit_full, tighten_stop, halt_buys_today]
  forbidden_actions: [buy, set_bias_favour, loosen_stop, raise_cap, change_floor, change_gap, skip_limits]

# ---- thrift mode (simgold/budget.py, tools/budget.py): routines on plan limits spend less; no trading rule changes ----
budget:
  thrift_fastlane_max_per_day: 2     # fast-lane routine wake-ups a day in THRIFT mode (normal: fast_lane.max_runs_per_day = 4)
  thrift_hourly_opus: false          # THRIFT: the hourly routine does not spawn an Opus subagent
  thrift_weekly_short: true          # THRIFT: short weekly review, no rule proposals unless the evidence is strong
  thrift_incident_opus_only_high: true   # THRIFT: the incident routine uses Opus only for HIGH / COMPLEX

events:
  calendar_file: events.json
  us_cpi:   {no_metal_buys_after: "13:00", overnight_gap_mult: 1.5, next_day_no_buys_before: "09:45", applies: [GOLDBEES, SILVERBEES]}
  us_jobs:  {no_metal_buys_after: "13:00", overnight_gap_mult: 1.5, next_day_no_buys_before: "09:45", applies: [GOLDBEES, SILVERBEES]}
  fomc:     {no_metal_buys_all_day: true, overnight_gap_mult: 2.0, next_day_no_buys_before: "10:15", applies: [GOLDBEES, SILVERBEES]}
  rbi:      {no_buys_window: ["09:15", "10:45"], applies: all}
  union_budget: {same_as: fomc}
  hindcopper_results: {no_buys_from_days_before: 2, exit_by: "15:00", exit_day: day_before, resume: "10:15 on 2nd trading day after"}

month_end:
  protect_last_trading_days: 3
  no_new_buys: true
  gap_mult: 1.5
  required_min: max(floor, 100000) + 200
  flatten_if_value_below: 100300
  last_day_exit_time: "15:15"
  last_day_min_after_stop: 100200

governance:
  weekly_review_can_tighten: true
  loosening_requires_owner_approval: true


# ---- STRATEGY v2 "trend core" (growth, AGGRESSIVE risk profile): simgold/trend.py, engine daily check, docs/RULEBOOK.md "Strategy v2" ----
# mode v2_trend: trend-following core sized by volatility; the Green Guard floor, gap sizing, the 30% cash rule, the entry
# score and the month-end rules above are NOT used. mode v1_scores: the old Green Guard rules above, unchanged.
# ROLLBACK = change the next line to v1_scores (one line). Note: v1 then re-applies its floor (99,500 or more) at once, so a
# portfolio under that floor is flattened by the tripwire on the next tick.
strategy:
  mode: v2_trend                      # v2_trend | v1_scores
  profile: aggressive                 # the owner's risk choice; the numbers below ARE the profile
  vol_target: 0.14                    # per-asset annual volatility target: weight = min(cap, vol_target / sigma60)
  vol_span: 60                        # sigma60: 60-day close-to-close volatility, annualised x sqrt(252)
  vol_method: ewma                    # ewma (span 60, as in the research) | simple (rolling 60-day standard deviation)
  symbols:
    GOLDBEES:   {signal: sma_trend, cap: 1.00}      # ON when close > SMA200
    SILVERBEES: {signal: donchian,  cap: 0.70}      # ON when close > highest high of the prior 55 days
    HINDCOPPER: {signal: donchian,  cap: 0.35}      # same; also keeps the results-day block and sell-before-results rules
  sma_days: 200
  sma_hysteresis: 0.005               # ON above SMA x 1.005, OFF below SMA x 0.995, in between the previous state is kept
  donchian_entry_days: 55
  donchian_exit_days: 20              # OFF below max(peak close since entry - atr_mult x ATR, lowest low of the prior 20 days)
  atr_days: 20
  atr_mult: 3.0
  min_invested: 0.50                  # D5 "stay invested": metals are at least 50% of the portfolio, held as GOLDBEES even when its trend is OFF
  floor_symbol: GOLDBEES              # (0 turns the floor off = plain v2)
  stop_to_gold: true                  # a SILVERBEES/HINDCOPPER that is OFF hands its vol weight min(cap, vol_target/sigma) to gold ...
  stop_to_gold_requires_gold_trend: true   # ... only while gold is above its SMA200
  rebalance_threshold: 0.05           # trade only when |target - current| > 5 points of portfolio value (to/from zero always trades)
  min_entry_weight: 0.01              # no new position smaller than 1% of the portfolio
  entry:
    rsi_days: 2                       # RSI(2) of daily closes, today's live price is the provisional close
    rsi_timing: false                 # false (D5): entries and adds go straight to the target, no RSI(2) wait. true = the earlier v2: wait for ...
    overbought: 90                    # (rsi_timing true) a NEW entry waits while RSI(2) is above this
    dip_rsi: 5                        # (rsi_timing true) while ON and below target, ADD only when RSI(2) < 5
    favour_dip_rsi: 15                # bias favour only LOOSENS the dip: add when RSI(2) < 15 (it never removes the dip requirement)
  check_time: "15:10"                 # the daily trend check (entries, adds, rebalances AND exits) runs once, from this IST time ...
  check_until: "15:25"                # ... and is retried each minute until this time if a price is missing or stale
  history_period: "3y"                # daily history the live engine downloads for the SMA200, Donchian and volatility
  brake:                              # drawdown brake on total value from its peak (checked at the daily check)
    level1_dd: 0.15                   # -15%: every target weight x level1_mult
    level1_mult: 0.5
    level1_release_dd: 0.13           # back above -13% releases level 1 (small hysteresis against flip-flopping)
    level2_dd: 0.25                   # -25%: targets 0 ...
    level2_release_dd: 0.15           # ... until value is back above -15% (then level 1 if still under -13%, else level 0) ...
    level2_min_days: 20               # ... OR after this many trading days at level 2 once at least one trend has re-confirmed
                                      #     (OFF then ON again): level 1 (half size) with the peak re-based to the current value
    level1_min_days: 20               # a re-based level 1 goes to level 0 only after this many trading days ...
    rebase_release_gain: 0.03         # ... AND value more than 3% above the re-based value
  account_stop: 75000                 # hard account stop: value at or under it SELLS EVERYTHING at once, halts buys, raises a HIGH alert (also the engine's "floor")
  account_stop_clear_after: null      # OWNER ONLY: the stop latches. To resume trading set this to an ISO date on or after the day it fired (e.g. "2026-12-01") in a commit
  stops:                              # owner approval 2026-10-29: stop-loss package D5-S (docs/RULEBOOK.md V2.3 / V2.4; absent = the older behaviour)
    intraday_exit: [SILVERBEES, HINDCOPPER]   # the trend exit level max(peak - 3 x ATR20, 20-day low) is enforced every minute ([] = daily check only)
    confirm_ticks: 2                  # consecutive FRESH prices at or under a level before a stop sells (trend exit and AI stops)
    gap: sell                         # an open already under the level sells as soon as the confirm ticks are in (no waiting for the close)
    protect_floor: true               # AI tighten_stop / sell_fraction / block never touch the GOLDBEES floor units; only the -25% brake and the account stop sell them
  fast_lane_portfolio_drop: 0.015     # portfolio fast-lane trigger under v2: value fell this share of itself within portfolio_drop_window_min
  data:                               # daily-bar sanity filter (Yahoo glitches) and history download failures
    spike_move: 0.25                  # a close more than 25% from the previous close that reverts over half the next day is dropped (ETFs) ...
    spike_move_equity: 0.30           # ... 30% for HINDCOPPER
    hl_range_mult: 4.0                # highs and lows are clipped to close +/- 4 x the median true range
    history_fail_alert_after: 3       # consecutive failed daily-history downloads before a MEDIUM alert
  backtest:                           # run_backtest.py --strategy v2
    cost_per_side: {GOLDBEES: 0.0015, SILVERBEES: 0.0015, HINDCOPPER: 0.0030}   # costs + slippage, as in the research
    lag_days: 1                       # signal at close t, fill at close t+1 (the live engine fills at the check, so this is conservative)
    oos_years: 2                      # the "last 2 years" out-of-sample window

# ---- engine-only extras (not in the rulebook block) ---------------------------------
engine:
  tickers: {GOLDBEES: GOLDBEES.NS, SILVERBEES: SILVERBEES.NS, HINDCOPPER: HINDCOPPER.NS}
  kinds:   {GOLDBEES: etf, SILVERBEES: etf, HINDCOPPER: equity}
  aliases: {GOLD: GOLDBEES, SILVER: SILVERBEES, COPPER: HINDCOPPER}
  required_min_buffer: 200           # month_end.required_min = max(floor, 100000) + 200
  month_end_floor_base: 100000
  stale_feed_skip_min: 15            # all feeds older than this: skip the tick entirely
  streak_max_gap_sec: 150            # a gap between observations longer than this restarts the 3-minute confirmation
  hindcopper_exit_lead_min: 5        # "sell by 15:00" is executed from 14:55
  hindcopper_intraday_exit_lead_min: 10
  fastlane_max_block: end_of_day     # block_until from the fast lane is clamped to today
  fastlane_max_age_min: 30           # ignore fastlane.json older than this when first seen
  market_open: "09:15"
  market_close: "15:30"

# ---- memory layer and Claude routines (tools/should_think.py, tools/write_brief.py, tools/context.py) ----
routines:
  guidance_max_age_hours: 3          # guidance.json older than this (or missing) -> think
  move_factor: 0.75                  # think if a price moved this share of its fast-lane 10-min threshold since the last guidance
  headline_urgency: 3                # a new headline at this urgency or above (since the last guidance) -> think
  event_lookahead_days: 1            # an event today or within this many days -> think
  stop_proximity_pct: 0.01           # an open position within 1% of its stop -> think
  cushion_below: 300                 # cushion (value - floor) under this many rupees -> think
  brief_max_lines: 120
  brief_max_bytes: 6000
  brief_max_headlines: 15
  brief_max_decisions: 25
  brief_headline_max_age_hours: 36   # older headlines are never shown as "new"
  seen_headlines_keep: 2000         # dedupe memory: at most this many headline hashes ...
  seen_headlines_days: 7            # ... and none older than this
  context_max_bytes: 25000
  context_daily_notes: 3

# ---- alert policy (simgold/alerts.py) ----------------------------------------------------
alerts:
  max_fires_per_day: 6               # routine wake-ups per IST day across all sources (HIGH included)
  group_window_min: 15               # non-HIGH alerts within this long after a HIGH fire join its email
  medium_reminder_hours: [1, 4]      # MEDIUM "Still broken" ladder, then once a day
  medium_reminder_daily_hours: 24
  high_reminder_min: 60              # HIGH is re-sent hourly until acknowledged
  high_reminder_due_min: 55          # the hourly workflow treats a HIGH as due once its last email is this old
  max_reminders_per_incident: 24
  max_medium_reminders: 10           # MEDIUM "still broken" reminders per incident (1 h, 4 h, then daily), then silence
  tick_exceptions: 3                 # consecutive tick exceptions -> HIGH (exits and floor are not enforced)
  no_prices_min: 10                  # data source down this long during market hours -> MEDIUM
  git_push_fail_min: 15              # git sync failing this long -> HIGH
  stale_guidance_hours: 3
  safe_mode_incidents: 5             # more than this many distinct incidents in a day -> safe mode
  safe_mode_fix_window_min: 30       # a HIGH still open this long -> safe mode
  watchdog_stale_min: 75             # state/health.json older than this in market hours -> HIGH (GitHub cron is late; the hourly routine dispatches the watchdog)
  near_floor_inr: 100                # value this close to (or under) the floor is HIGH

# ---- fallback when Claude cannot run at all (simgold/fallback_llm.py, tools/fallback_brain.py, tools/fallback_report.py) ----
# Used ONLY when the watchdog reports routines_silent. DeepSeek is OpenAI-compatible; the key lives in the GitHub secret
# DEEPSEEK_API_KEY (never in the repo). Each model list is a preference order; the first ID the account really has is used.
fallback:
  base_url: https://api.deepseek.com
  models:
    thinking: [deepseek-v4-pro, deepseek-reasoner]
    fast: [deepseek-flash, deepseek-v4-flash, deepseek-chat]
  temperature: 0.2
  timeout_s: 60
  retries: 2
  max_tokens: {thinking: 2000, fast: 600}
  min_minutes_between_brain_runs: 55

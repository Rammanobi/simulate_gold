name: watchdog

# Health check every 10 min while NSE is open (the script filters to 09:10-15:40 IST), plus once after the close.
# GitHub cron can run late; tools/healthcheck.py writes state/health.json and reminders.yml / the hourly routine
# check that file's age (dead-man's switch), so this watchdog is itself watched.
on:
  schedule:
    - cron: "*/10 3-10 * * 1-5"
    - cron: "0 11 * * 1-5"        # 16:30 IST
    - cron: "15 11 * * 1-5"       # 16:45 IST (is the daily report there? Claude routines silent?)
  workflow_dispatch:

permissions:
  actions: write      # dispatch market-hours.yml when the engine run is missing (self-heal)
  contents: write     # commits state/alerts.json, health.json and logs/health-DATE.jsonl
  issues: write       # open / comment on / close the "Claude routines not running" issue

concurrency:
  group: alert-state
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      ROUTINE_INCIDENT_URL: ${{ secrets.ROUTINE_INCIDENT_URL }}
      ROUTINE_INCIDENT_TOKEN: ${{ secrets.ROUTINE_INCIDENT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 60          # healthcheck reads state/portfolio.json history for the floor-monotonic check
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Health check
        id: hc
        run: |
          set +e
          python tools/healthcheck.py --pull > "$RUNNER_TEMP/problems.txt"
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          { echo '### Watchdog'; echo '```'; cat "$RUNNER_TEMP/problems.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "missing=$(grep -c 'engine_run_missing\|ticks_missing\|ticks_stale' "$RUNNER_TEMP/problems.txt")" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Claude routines silent? (issue = free email to the owner, no AI needed)
        run: |
          set +e
          TITLE="Claude routines not running (usage limit or credits?)"
          num=$(gh api "repos/$GH_REPO/issues?state=open&labels=routines-silent&per_page=1" --jq '.[0].number // empty' 2>/dev/null)
          if grep -q '"check": *"routines_silent"' "$RUNNER_TEMP/problems.txt"; then
            detail=$(grep '"check": *"routines_silent"' "$RUNNER_TEMP/problems.txt" | head -1 | jq -r '.detail // ""')
            body="The watchdog found: ${detail}. Check claude.ai usage limits and cloud-session credits. Trading is not affected (the engine uses fixed rules); the DeepSeek fallback (fallback.yml) covers guidance and the daily report if DEEPSEEK_API_KEY is set. Checked $(date '+%F %H:%M') IST."
            if [ -z "$num" ]; then
              gh api -X POST "repos/$GH_REPO/issues" -f title="$TITLE" -f body="$body" -f 'labels[]=routines-silent' >/dev/null \
                && echo "opened routines-silent issue" >> "$GITHUB_STEP_SUMMARY"
            else
              gh api -X POST "repos/$GH_REPO/issues/$num/comments" -f body="Still silent at $(date '+%H:%M') IST: ${detail}" >/dev/null
            fi
            # fallback: guidance / daily report written by DeepSeek (the workflow decides what is due)
            gh api -X POST "repos/$GH_REPO/actions/workflows/fallback.yml/dispatches" -f ref=main >/dev/null 2>&1 \
              && echo "dispatched fallback.yml" >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$num" ]; then
            gh api -X POST "repos/$GH_REPO/issues/$num/comments" -f body="The Claude routines are running again ($(date '+%H:%M') IST). Closing." >/dev/null
            gh api -X PATCH "repos/$GH_REPO/issues/$num" -f state=closed >/dev/null
          fi
          exit 0

      - name: Self-heal, re-dispatch the engine
        if: steps.hc.outputs.rc == '4' && steps.hc.outputs.missing != '0'
        run: |
          set +e
          queued=$(gh api "repos/$GH_REPO/actions/workflows/market-hours.yml/runs?status=queued&per_page=1" --jq .total_count 2>/dev/null)
          if [ "${queued:-0}" = "0" ]; then
            gh api -X POST "repos/$GH_REPO/actions/workflows/market-hours.yml/dispatches" -f ref=main -f 'inputs[session]=auto' \
              && echo "Re-dispatched market-hours.yml (session=auto)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "market-hours.yml already queued; not re-dispatching" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

      - name: Alert policy and wake the routine
        run: |
          set +e
          if [ "${{ steps.hc.outputs.rc }}" = "4" ]; then
            decision=$(python -m simgold.alerts problems "$RUNNER_TEMP/problems.txt")
            echo "decision: $decision" >> "$GITHUB_STEP_SUMMARY"
            if [ "$(echo "$decision" | jq -r '.fire // false')" = "true" ]; then
              echo "$decision" | jq -c '{source:"watchdog",workflow:"watchdog",problems:[.decisions[]|select(.new)|{fingerprint,severity}],text:"see state/alerts.json"}' > "$RUNNER_TEMP/facts.json"
              head -c 5000 "$RUNNER_TEMP/problems.txt" > "$RUNNER_TEMP/p.txt"
              jq -cn --rawfile p "$RUNNER_TEMP/p.txt" --slurpfile f "$RUNNER_TEMP/facts.json" '$f[0] + {problems_raw:$p}' > "$RUNNER_TEMP/facts2.json"
              python -m simgold.alerts post --text-file "$RUNNER_TEMP/facts2.json" >> "$GITHUB_STEP_SUMMARY"
            fi
            current=$(jq -r '.check' "$RUNNER_TEMP/problems.txt" 2>/dev/null | paste -sd, -)
          else
            current=""
          fi
          # problems that went away: mark resolved; the routine sends exactly one Resolved email if it ever emailed them
          res=$(python -m simgold.alerts resolve-missing --component watchdog --current "$current")
          for id in $(echo "$res" | jq -r '.resolved_emailed[]?'); do
            jq -cn --arg id "$id" '{mode:"resolved",incident_id:$id}' > "$RUNNER_TEMP/r.json"
            python -m simgold.alerts post --text-file "$RUNNER_TEMP/r.json" >> "$GITHUB_STEP_SUMMARY"
          done
          exit 0

      - name: Commit alert and health state
        if: always()
        run: |
          set +e
          git config user.name "simgold-watchdog"; git config user.email "actions@users.noreply.github.com"
          git config merge.simgold-alerts.driver "python -m simgold.alerts merge-file %O %A %B"   # state/alerts.json is merged as JSON (.gitattributes)
          for p in state/alerts.json state/safe_mode.json state/health.json logs/health-*.jsonl; do [ -e "$p" ] && git add -A -- "$p"; done
          git diff --cached --quiet || git commit -qm "watchdog: health $(date +%H:%M) IST"
          for i in 1 2 3; do git pull --rebase --autostash -X theirs -q || git rebase --abort; git push -q && break; sleep 5; done
          exit 0

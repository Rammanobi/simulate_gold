name: weekly backtest
on:
  schedule:
    - cron: "30 2 * * 6"   # Saturday 08:00 IST
  workflow_dispatch:
    inputs:
      strategy:
        description: "strategy to backtest (live strategy is v2)"
        type: choice
        options: [v2, v1]
        default: v2
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - run: |
          if [ "${{ inputs.strategy || 'v2' }}" = "v1" ]; then
            python run_backtest.py --strategy v1
          else
            python run_backtest.py --strategy v2 --out reports/backtest_v2.md
          fi
      - run: |
          git config user.name "paper-trader-bot"
          git config user.email "actions@users.noreply.github.com"
          for f in reports/backtest.md reports/backtest_equity.csv reports/backtest_v2.md; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet || git commit -m "backtest: $(date +%F)"
          for i in 1 2 3; do
            git pull --rebase --autostash -q || { git rebase --abort || true; }
            git push -q && break
            sleep 5
          done

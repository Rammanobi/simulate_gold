name: market-hours paper trading

# NSE is open 09:15-15:30 IST = 03:45-10:00 UTC, Mon-Fri. Public repo, so Actions minutes are free.
# Two sessions per day (a job is capped at 6 h), 60-second ticks inside each:
#   morning   starts 09:10 IST, loops until 12:20 IST
#   afternoon starts 12:15 IST (backup cron), loops until 15:35 IST
# The engine skips weekends and NSE holidays itself.
on:
  schedule:
    - cron: "40 3 * * 1-5"   # 09:10 IST
    - cron: "45 6 * * 1-5"   # 12:15 IST (backup / afternoon session)
  workflow_dispatch:
    inputs:
      session:
        description: "auto = pick by IST time; once = one forced tick (testing)"
        type: choice
        options: [auto, morning, afternoon, once]
        default: auto

permissions:
  contents: write

concurrency:
  group: paper-trader
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SIMGOLD_GIT_SYNC: "1"
      TZ: Asia/Kolkata
      ROUTINE_FIRE_URL: ${{ secrets.ROUTINE_FIRE_URL }}       # optional; may be empty
      ROUTINE_FIRE_TOKEN: ${{ secrets.ROUTINE_FIRE_TOKEN }}   # optional; may be empty
      ROUTINE_INCIDENT_URL: ${{ secrets.ROUTINE_INCIDENT_URL }}       # optional; engine incident webhook
      ROUTINE_INCIDENT_TOKEN: ${{ secrets.ROUTINE_INCIDENT_TOKEN }}   # optional; may be empty
    steps:
      - uses: actions/checkout@v4
      - name: Git identity
        run: |
          git config user.name "simgold-engine"
          git config user.email "actions@users.noreply.github.com"
          git config merge.simgold-alerts.driver "python -m simgold.alerts merge-file %O %A %B"   # state/alerts.json is merged as JSON (.gitattributes)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - name: Run paper-trading loop
        run: |
          SESSION="${{ inputs.session }}"
          [ -z "$SESSION" ] && SESSION=auto
          if [ "$SESSION" = "auto" ]; then
            if [ "$(date +%H%M)" -lt 1215 ]; then SESSION=morning; else SESSION=afternoon; fi
          fi
          echo "session: $SESSION (IST $(date +%H:%M))"
          case "$SESSION" in
            morning)   python run_live.py --tick-seconds 60 --until 12:20 ;;
            afternoon) python run_live.py --tick-seconds 60 --until 15:35 ;;
            once)      python run_live.py --once --force ;;
          esac
      - name: Final sync
        if: always()
        # same path as the in-loop sync: add -> commit -> pull --rebase (-X theirs) -> push, 3 tries, and a merge
        # fallback when a rebase cannot finish, so the session's portfolio state always reaches main
        run: |
          python -c "import pathlib, sys; from simgold import gitsync; sys.exit(0 if gitsync.sync(pathlib.Path('.')) else 1)"

name: market-hours paper trading

# NSE is open 09:15-15:30 IST = 03:45-10:00 UTC, Mon-Fri. Public repo, so Actions minutes are free.
# Two sessions per day (a job is capped at 6 h), 60-second ticks inside each:
#   morning   starts 09:00 / 09:10 IST, loops until 12:20 IST
#   afternoon starts 12:15 IST (backup cron), loops until 15:35 IST
# The engine skips weekends and NSE holidays itself, and exits at once (success) when an older run of this
# workflow is still in progress (simgold/runguard.py), so a duplicate dispatch or a late cron never trades twice.
on:
  schedule:
    - cron: "30 3 * * 1-5"   # 09:00 IST (backup for a late 09:10 run; the concurrency group + state/.engine.lock stop doubles)
    - cron: "40 3 * * 1-5"   # 09:10 IST
    - cron: "45 6 * * 1-5"   # 12:15 IST (backup / afternoon session)
  workflow_dispatch:
    inputs:
      session:
        description: "auto = pick by IST time; once = one forced tick (testing)"
        type: choice
        options: [auto, morning, afternoon, once]
        default: auto

permissions:
  contents: write
  actions: read       # simgold/runguard.py: is an older engine run already in progress? then this one exits

concurrency:
  group: paper-trader
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SIMGOLD_GIT_SYNC: "1"
      SIMGOLD_LIVE_PUSH: "1"      # live P&L file to the `live` branch every tick (simgold/livepush.py); 0/unset = off
      TZ: Asia/Kolkata
      ROUTINE_FIRE_URL: ${{ secrets.ROUTINE_FIRE_URL }}       # optional; may be empty
      ROUTINE_FIRE_TOKEN: ${{ secrets.ROUTINE_FIRE_TOKEN }}   # optional; may be empty
      ROUTINE_INCIDENT_URL: ${{ secrets.ROUTINE_INCIDENT_URL }}       # optional; engine incident webhook
      ROUTINE_INCIDENT_TOKEN: ${{ secrets.ROUTINE_INCIDENT_TOKEN }}   # optional; may be empty
      GH_TOKEN: ${{ github.token }}     # read-only use: the run guard lists this workflow's in-progress runs
    steps:
      - uses: actions/checkout@v4
        with:
          # the tip of main when the job STARTS, not the commit it was dispatched on: a run that waited in the
          # concurrency queue for hours otherwise starts on old state and its sync overwrites newer logs (14 Oct 2026)
          ref: main
      - name: Git identity
        run: |
          git config user.name "simgold-engine"
          git config user.email "actions@users.noreply.github.com"
          git config merge.simgold-alerts.driver "python -m simgold.alerts merge-file %O %A %B"   # state/alerts.json is merged as JSON (.gitattributes)
          git config merge.simgold-append.driver "python -m simgold.logmerge merge-file %O %A %B %P"   # append-only logs: union of rows
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests (pytest)
        id: tests
        continue-on-error: true      # a failing test must not stop the trading day: the engine then runs in SAFE MODE
        run: python -m pytest -q tests
      - name: Run paper-trading loop
        run: |
          SESSION="${{ inputs.session }}"
          [ -z "$SESSION" ] && SESSION=auto
          if [ "$SESSION" = "auto" ]; then
            if [ "$(date +%H%M)" -lt 1215 ]; then SESSION=morning; else SESSION=afternoon; fi
          fi
          echo "session: $SESSION (IST $(date +%H:%M))"
          SAFE=""
          if [ "${{ steps.tests.outcome }}" = "failure" ]; then
            SAFE="--safe-mode"     # exits, stops and the floor only; no buys (reason "tests failing")
            echo "::warning::pytest failed, so this session runs in SAFE MODE (no buys)"
          fi
          case "$SESSION" in
            morning)   python run_live.py --tick-seconds 60 --until 12:20 $SAFE ;;
            afternoon) python run_live.py --tick-seconds 60 --until 15:35 $SAFE ;;
            once)      python run_live.py --once --force $SAFE ;;
          esac
      - name: Final sync
        if: always()
        # same path as the in-loop sync: add -> commit -> pull --rebase (-X theirs; the append-only logs use the
        # simgold-append union driver instead) -> push, 3 tries, and a merge fallback when a rebase cannot finish
        run: |
          python -c "import pathlib, sys; from simgold import gitsync; sys.exit(0 if gitsync.sync(pathlib.Path('.')) else 1)"
      - name: Fail the run so the incident pipeline alerts (pytest failed on main)
        if: always() && steps.tests.outcome == 'failure'
        run: |
          echo "pytest failed; trading ran in safe mode. Failing this run so the incident pipeline raises test_failure_main."
          exit 1
